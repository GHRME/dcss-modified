name: Build DCSS macOS Tiles

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: brew install pkg-config

      - name: Download DCSS 0.34.1 source
        run: |
          curl -L https://github.com/crawl/crawl/releases/download/0.34.1/stone_soup-0.34.1.tar.xz -o dcss.tar.xz
          tar -xf dcss.tar.xz
          mv stone_soup-0.34.1 dcss-src

      - name: Apply modified files
        run: |
          cp player.cc dcss-src/source/player.cc
          cp player-act.cc dcss-src/source/player-act.cc

      - name: Build
        run: |
          python3 -m pip install pyyaml --break-system-packages || python3 -m pip install pyyaml --user || python3 -m pip install pyyaml
          python3 -c "import yaml; print('yaml OK')"
          cd dcss-src/source
          python3 util/mon-gen.py dat/mons/ util/mon-gen/ mon-data.h
          python3 util/form-gen.py dat/forms/ util/form-gen/ transformation.h form-data.h
          python3 util/species-gen.py dat/species/ util/species-gen/ species-data.h aptitudes.h species-groups.h species-type.h
          python3 util/job-gen.py dat/jobs/ util/job-gen/ job-data.h job-groups.h job-type.h
          make -j4 TILES=y

      - name: Package as .app
        run: |
          mkdir -p DCSS-Modified.app/Contents/MacOS
          cp dcss-src/source/crawl DCSS-Modified.app/Contents/MacOS/
          cp -r dcss-src/source/dat DCSS-Modified.app/Contents/MacOS/
          mkdir -p DCSS-Modified.app/Contents/MacOS/contrib/fonts
          cp dcss-src/source/contrib/fonts/*.ttf DCSS-Modified.app/Contents/MacOS/contrib/fonts/
          cp -r dcss-src/source/settings DCSS-Modified.app/Contents/MacOS/ 2>/dev/null || true
          printf '#!/bin/bash\nDIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"\ncd "$DIR"\nexec "$DIR/crawl" "$@"\n' > DCSS-Modified.app/Contents/MacOS/DCSS-Modified
          chmod +x DCSS-Modified.app/Contents/MacOS/DCSS-Modified
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0">\n<dict>\n  <key>CFBundleExecutable</key><string>DCSS-Modified</string>\n  <key>CFBundleIdentifier</key><string>com.dcss.modified</string>\n  <key>CFBundleName</key><string>DCSS Modified</string>\n  <key>CFBundleVersion</key><string>0.34.1-mod</string>\n</dict>\n</plist>\n' > DCSS-Modified.app/Contents/Info.plist
          echo "=== MacOS dir contents ==="
          ls DCSS-Modified.app/Contents/MacOS/
          zip -r DCSS-Modified.zip DCSS-Modified.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DCSS-Modified-macOS
          path: DCSS-Modified.zip
          retention-days: 7
